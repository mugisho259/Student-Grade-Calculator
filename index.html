<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h1>Student Grade Calculator</h1>
    <div class="container">
        <form id="gradeForm">
            <!-- Subject fields are generated dynamically from the SUBJECTS config in app.js -->
            <div class="form-actions">
                <button type="button" onclick="calculateGrade()">Calculate</button>
                <button type="reset" onclick="resetResult()">Reset</button>
                <p><strong>Greeting from Mugisho Munganga</strong></p>
            </div>
        </form>
    </div>

    <h3 id="result"></h3>

    <script src="utils.js"></script>
    <script src="app.js"></script>
</body>
</html>
