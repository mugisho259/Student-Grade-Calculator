<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h1>Student Grade Calculator</h1>
    <div class="container">
        <form id="gradeForm">
            <label for="sub1">Maths</label>
            <input type="number" id="sub1" min="0" max="100" placeholder="Enter Maths Mark e.g 90" required>
            
            <label for="sub2">English</label>
            <input type="number" id="sub2" min="0" max="100" placeholder="Enter English Mark" required>
            
            <label for="sub3">Chemistry</label>
            <input type="number" id="sub3" min="0" max="100" placeholder="Enter Chemistry Mark" required>
            
            <label for="sub4">Physics</label>
            <input type="number" id="sub4" min="0" max="100" placeholder="Enter Physics Mark" required>
            
            <button type="button" onclick="calculateGrade()">Calculate</button>
            <button type="reset" onclick="document.getElementById('result').textContent=''">Reset</button>
            <p><strong>Greeting from Mugisho Munganga</strong></p>
        </form>
    </div>
    
    <h3 id="result"></h3>

    <script src="calculator.js"></script>
</body>
</html>
