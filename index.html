<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h1>Student Grade Calculator</h1>
    <div class="container">
        <form id="gradeForm">
            <label for="sub1">Maths</label>
            <input type="number" id="sub1" min="0" max="100" required placeholder="Enter Maths Mark e.g 90">
            
            <label for="sub2">English</label>
            <input type="number" id="sub2" min="0" max="100" required placeholder="Enter English Mark">
            
            <label for="sub3">Chemistry</label>
            <input type="number" id="sub3" min="0" max="100" required placeholder="Enter Chemistry Mark">
            
            <label for="sub4">Physics</label>
            <input type="number" id="sub4" min="0" max="100" required placeholder="Enter Physics Mark">
            
            <button type="button" onclick="calculateGrade()">Calculate</button>
            <button type="reset" onclick="document.getElementById('result').innerHTML=''">Reset</button>
            <p><strong>Greeting from Mugisho Munganga</strong></p>
        </form>
    </div>
    
    <h3 id="result"></h3>

    <script>
        function parseAndValidateMark(inputId, subjectName) {
            var raw = document.getElementById(inputId).value.trim();
            if (raw === "") {
                return { error: subjectName + " mark is required." };
            }
            var mark = Number(raw);
            if (isNaN(mark)) {
                return { error: subjectName + " mark must be a valid number." };
            }
            if (mark < 0 || mark > 100) {
                return { error: subjectName + " mark must be between 0 and 100." };
            }
            return { value: mark };
        }

        function calculateGrade() {
            var resultEl = document.getElementById("result");
            var subjects = [
                { id: "sub1", name: "Maths" },
                { id: "sub2", name: "English" },
                { id: "sub3", name: "Chemistry" },
                { id: "sub4", name: "Physics" }
            ];

            var errors = [];
            var marks = [];

            for (var i = 0; i < subjects.length; i++) {
                var parsed = parseAndValidateMark(subjects[i].id, subjects[i].name);
                if (parsed.error) {
                    errors.push(parsed.error);
                } else {
                    marks.push(parsed.value);
                }
            }

            if (errors.length > 0) {
                resultEl.style.color = "#dc2626";
                resultEl.innerHTML = errors.join("<br>");
                return;
            }

            // Calculating the total marks and the average marks
            var totalmarks = 0;
            for (var i = 0; i < marks.length; i++) {
                totalmarks += marks[i];
            }
            var averagemark = totalmarks / marks.length;

            // Determining the grade
            var grade;
            if (averagemark >= 80) {
                grade = "A";
            } else if (averagemark >= 70) {
                grade = "B";
            } else if (averagemark >= 60) {
                grade = "C";
            } else if (averagemark >= 50) {
                grade = "D";
            } else {
                grade = "F";
            }

            // Displaying the results
            resultEl.style.color = "#334155";
            resultEl.innerHTML = 
                "Total Marks: " + totalmarks + "<br>" + 
                "Average: " + averagemark.toFixed(2) + "<br>" + 
                "Grade: " + grade;
        } 
    </script>
</body>
</html>
